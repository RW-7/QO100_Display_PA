[platformio]
default_envs = m5stack_core2
src_dir = QO100_Display

[env:m5stack_core2]
platform = espressif32 @ 6.12.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
  -D BOARD_HAS_PSRAM
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  arduino-libraries/NTPClient
  m5stack/M5Unified
; CIVmasterLib and the current TFT_eSPI touch API still require
; compatibility verification before this can be regarded as build-ready.
